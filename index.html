<html lang="zh-Hant">
  <head>

    <title>我們的小島 Our Little Island</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f8f8f0; color: #46503f; }
      .boot-message { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px; box-sizing: border-box; font-family: system-ui, sans-serif; }
      .boot-message h1 { font-size: 28px; letter-spacing: 4px; }
      .boot-message p { font-size: 14px; line-height: 2; color: #7c8c6b; }
      .boot-message button { border: 0; border-radius: 8px; background: #758b61; color: white; padding: 12px 20px; margin: 12px auto; cursor: pointer; }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23738b59'/%3E%3Cpath d='M18 42V26l14-9 14 9v16H18' fill='%23fff8e7'/%3E%3Cpath d='M28 42V31h8v11' fill='%23e2ac72'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-N7uNHn1w.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dm8d-zYb.css">
  </head>
  <body>
    <div id="app"><div class="boot-message"><h1>✿ 我們的小島</h1><p id="boot-status">正在準備你的家族小島…</p><button id="boot-retry" hidden onclick="location.reload()">重新載入</button><noscript><p>請開啟瀏覽器的 JavaScript，使用小島的互動功能。</p></noscript></div></div>
    <script>
      function showBootError() {
        if (document.documentElement.dataset.appReady) return;
        const status = document.getElementById('boot-status');
        if (status) status.textContent = '頁面資源未能完整載入，請重新載入。若仍失敗，請確認正在開啟網站伺服器提供的頁面。';
        const retry = document.getElementById('boot-retry');
        if (retry) retry.hidden = false;
      }
      window.addEventListener('error', showBootError, true);
      window.addEventListener('unhandledrejection', showBootError);
      setTimeout(showBootError, 15000);
    </script>
  </body>
</html>
